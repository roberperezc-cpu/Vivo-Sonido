<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonido Vivo - Registro de Cliente</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <div class="logo">
      <h1>Sonido Vivo</h1>
      <p>Viña del Mar</p>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Catálogo</a></li>
        <li><a href="login.html">Ingresar</a></li>
        <li><a href="registro.html">Registro</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="form-container">
      <h2>Registro de Nuevo Cliente</h2>
      <p>Crea tu cuenta para realizar compras y dar seguimiento a tus envíos:</p><br>

      <form id="form-registro" novalidate>
        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre">
          <span class="error-msg"></span>
        </div>

        <div class="form-group">
          <label for="apellido">Apellido:</label>
          <input type="text" id="apellido">
          <span class="error-msg"></span>
        </div>

        <div class="form-group">
          <label for="reg-email">Correo Electrónico:</label>
          <input type="email" id="reg-email">
          <span class="error-msg"></span>
        </div>

        <div class="form-group">
          <label for="reg-pass">Contraseña:</label>
          <input type="password" id="reg-pass">
          <span class="error-msg"></span>
        </div>

        <div class="form-group">
          <label for="confirm-pass">Confirmar Contraseña:</label>
          <input type="password" id="confirm-pass">
          <span class="error-msg"></span>
        </div>

        <button type="submit" class="btn" style="width:100%;">Completar Registro</button>
      </form>
      <br>
      <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
      <p><a href="index.html">Volver a la página principal</a></p>
    </div>
  </main>

  

  <script src="js/script.js"></script>
</body>
</html>
