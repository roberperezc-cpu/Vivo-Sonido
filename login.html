<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonido Vivo - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <div class="logo">
      <h1>Sonido Vivo</h1>
      <p>Viña del Mar</p>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Catálogo</a></li>
        <li><a href="login.html">Ingresar</a></li>
        <li><a href="registro.html">Registro</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="form-container">
      <h2>Acceso a la Plataforma</h2>
      <p>Ingresa tus credenciales para gestionar o realizar tu compra:</p><br>
      
      <form id="form-login" novalidate>
        <div class="form-group">
          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" placeholder="ejemplo@correo.cl">
          <span class="error-msg"></span>
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres">
          <span class="error-msg"></span>
        </div>

        <button type="submit" class="btn" style="width:100%;">Iniciar Sesión</button>
      </form>
      <br>
      <p>¿Eres cliente nuevo? <a href="registro.html">Regístrate aquí</a></p>
      <p><a href="index.html">Volver a la página principal</a></p>
    </div>
  </main>

  

  <script src="js/script.js"></script>
</body>
</html>
